[tool.poetry]
name = "pets-environment"
version = "0.1.0"
description = "pets project"
authors = ["Nick Mazurkin <mazurkin@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "3.12.12"

[tool.poetry.group.platform.dependencies]
setuptools = "80.3.1"

[tool.poetry.group.util.dependencies]
tqdm = "4.67.1"
rich = "14.3.3"
tenacity = "8.2.3"
pydantic = "2.12.3"
loky = "3.5.6"
pyparsing = "3.2.3"
psutil = "7.1.3"
typer = "0.21.0"
joblib = "1.5.3"
argh = "0.29.4"

[tool.poetry.group.pandas.dependencies]
pandas = "2.3.3"
pandas-stubs = "2.3.3.251219"

[tool.poetry.group.calc.dependencies]
numpy = "2.3.5"

[tool.poetry.group.pytorch.dependencies]
torch = {url="https://download.pytorch.org/whl/cu130/torch-2.9.1%2Bcu130-cp312-cp312-manylinux_2_28_x86_64.whl"}
torchvision = {url="https://download-r2.pytorch.org/whl/cu130/torchvision-0.24.1%2Bcu130-cp312-cp312-manylinux_2_28_x86_64.whl"}
torchcodec = {url="https://download.pytorch.org/whl/cu130/torchcodec-0.11.0%2Bcu130-cp312-cp312-manylinux_2_28_x86_64.whl"}

[tool.poetry.group.lightning.dependencies]
lightning = "2.6.1"
torchmetrics = "1.8.2"
litlogger = "2026.3.17"

[tool.poetry.group.huggingface.dependencies]
huggingface_hub = {version="0.36.0", extras=["cli"]}
transformers = {version="4.57.6", extras=["torch"]}
sentence-transformers = "5.2.2"
datasets = "4.4.2"

[tool.poetry.group.misc.dependencies]
albumentations = "2.0.8"

[tool.poetry.group.tensorboard.dependencies]
tensorboard = "2.20.0"
tensorboard-plugin-profile = "2.21.3"

[tool.poetry.group.wandb.dependencies]
wandb = "0.25.0"

[tool.poetry.group.format.dependencies]
pyarrow = "22.0.0"
pyyaml = "6.0.3"

[tool.poetry.group.dev-lint.dependencies]
flake8 = "7.3.0"
pylint = "4.0.4"

[tool.poetry.group.dev-test.dependencies]
pytest = "8.4.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
markers = [
    "slow: the tests takes a long time (deselect with '-m \"not long\"')",
]
